name: Supply Chain

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The advisory DB changes independently of this repo, so re-check on a
  # schedule rather than only when someone happens to open a PR.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-deny@0.19.0" }
      - run: cargo deny check
