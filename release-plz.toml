[workspace]
# release-plz's own default. With `false`, a release that fails partway
# wedges: the release job skips every later push ("current commit is not
# from a release PR") while reporting green, and the PR job opens nothing
# because main's versions already match. release-plz has no retry, so
# `true` is the retry - each push republishes only what crates.io lacks.
release_always = true
# cargo-semver-checks builds the published version of each crate as its
# baseline and resolves the dependencies of that version anew. The published
# `ltk_game_index` 0.1.4 does not compile against `ltk_wad` 0.5.9, and each
# published crate that depends on it fails to build as a baseline. The
# conventional commits set the version bumps.
semver_check = false
changelog_update = true
git_tag_enable = true
git_release_enable = true
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }} v{{ version }}"
git_release_body = "{{ changelog }}"

[[package]]
name = "league-mod"
publish = false
changelog_update = true

[[package]]
name = "ltk_hashtable"
publish = true
changelog_update = true

[[package]]
name = "ltk_fantome"
publish = true
changelog_update = true

[[package]]
name = "ltk_modpkg"
publish = true
changelog_update = true

[[package]]
name = "ltk_mod_project"
publish = true
changelog_update = true

[[package]]
name = "ltk_mod_core"
publish = true
changelog_update = true

[[package]]
name = "ltk_overlay"
publish = true
changelog_update = true

[[package]]
name = "ltk_game_index"
publish = true
changelog_update = true

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
