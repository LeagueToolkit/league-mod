[package]
name = "ltk_overlay"
version = "0.9.8"
edition = "2024"
license = "Apache-2.0"
description = "WAD overlay/profile builder for League of Legends mods"
repository = "https://github.com/LeagueToolkit/league-mod"
homepage = "https://github.com/LeagueToolkit/league-mod"
documentation = "https://github.com/LeagueToolkit/league-mod/wiki"
keywords = ["league-of-legends", "modding", "gaming", "toolkit"]
categories = ["game-development"]
authors = ["LeagueToolkit"]

[dependencies]
ltk_game_data = { workspace = true }
ltk_game_index = { workspace = true, features = ["objects"] }

# LeagueToolkit crates
ltk_wad = { workspace = true, features = ["serde"] }
ltk_file = { workspace = true }
ltk_mod_project = { workspace = true, features = ["fantome"] }
ltk_modpkg = { workspace = true }
ltk_fantome = { workspace = true }
indexmap = { workspace = true }
ltk_rst = { workspace = true }

# Archive reading
zip = { workspace = true }
slug = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }

# Compression
zstd = { workspace = true }

# Hashing
xxhash-rust = { workspace = true }

# IO
byteorder = { workspace = true }
camino = { workspace = true, features = ["serde1"] }
walkdir = { workspace = true }
memmap2 = "0.9"

# Parallelism
rayon = { workspace = true }

[dev-dependencies]
ltk_meta = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
