[package]
name = "ltk_sig"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Signing and verification of League Toolkit mod packages (COSE/CWT tokens)"
repository = "https://github.com/LeagueToolkit/league-mod"
homepage = "https://github.com/LeagueToolkit/league-mod"
documentation = "https://github.com/LeagueToolkit/league-mod/wiki"
readme = "README.md"

[features]
## JSON platform-set template support, for build scripts baking the set.
json = ["dep:serde", "dep:serde_json"]
## Base-skin overlay verification diagnostics (pulls in the WAD/bin parsing
## stack, which pure token consumers do not need).
base-skin = ["dep:ltk_wad", "dep:ltk_meta", "dep:ltk_hash", "dep:tracing"]

[dependencies]
sha2 = "0.10.9"
ed25519-dalek = "2.1"
thiserror = "2.0.3"
miette = "7.6.0"
coset = "0.4.2"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
ltk_wad = { workspace = true, optional = true }
ltk_meta = { version = "0.6.0", optional = true }
ltk_hash = { version = "0.3.0", optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
indexmap = { workspace = true }
