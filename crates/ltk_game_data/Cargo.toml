[package]
name = "ltk_game_data"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Game-data declarations and BIN application for League Toolkit mods"
repository = "https://github.com/LeagueToolkit/league-mod"

[dependencies]
camino = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "1.2", default-features = false, features = ["deserialize"] }
toml = "1.1"
thiserror = "2"
ltk_meta = "0.8.2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
