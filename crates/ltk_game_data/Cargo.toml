[package]
name = "ltk_game_data"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
description = "Game-data declarations and BIN application for League Toolkit mods"
repository = "https://github.com/LeagueToolkit/league-mod"

[dependencies]
camino = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
serde-saphyr = { version = "1.2", default-features = false, features = ["deserialize", "serialize"] }
toml = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
ltk_meta = { workspace = true }
ltk_hash = { workspace = true, features = ["serde"] }
indexmap = { workspace = true }
xxhash-rust = { workspace = true }
glam = { workspace = true }
ltk_primitives = { workspace = true }
