[package]
name = "ltk_mod_project"
version = "0.6.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Types and helpers for League Toolkit mod project definitions"
repository = "https://github.com/LeagueToolkit/league-mod"
homepage = "https://github.com/LeagueToolkit/league-mod"
documentation = "https://github.com/LeagueToolkit/league-mod/wiki"
readme = "../../README.md"
keywords = ["league-of-legends", "modding", "gaming", "toolkit"]
categories = ["game-development"]
authors = ["LeagueToolkit"]

[dependencies]
camino = { workspace = true }
ignore = "0.4"
indexmap = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.8.19"
serde_json = "1.0"

# Optional: packing backends, one cargo feature per format
ltk_modpkg = { version = "0.7.0", path = "../ltk_modpkg", optional = true }
ltk_fantome = { version = "0.7.0", path = "../ltk_fantome", optional = true }
image = { version = "0.25", default-features = false, features = [
    "webp",
    "png",
    "jpeg",
    "gif",
    "bmp",
    "tiff",
    "ico",
], optional = true }
webp-animation = { version = "0.9", optional = true }
semver = { version = "1.0", optional = true }
slug = { version = "0.1", optional = true }

[features]
default = []
modpkg = ["dep:ltk_modpkg", "dep:image", "dep:webp-animation", "dep:semver"]
fantome = ["dep:ltk_fantome", "dep:image", "dep:slug"]

[dev-dependencies]
ltk_wad = { workspace = true }
tempfile = "3.15"
zip = "2.2.0"
