[package]
name = "ltk_mod_project"
version = "0.14.0"
edition = "2021"
license = "Apache-2.0"
description = "Types and helpers for League Toolkit mod project definitions"
repository = "https://github.com/LeagueToolkit/league-mod"
homepage = "https://github.com/LeagueToolkit/league-mod"
documentation = "https://github.com/LeagueToolkit/league-mod/wiki"
readme = "README.md"
keywords = ["league-of-legends", "modding", "gaming", "toolkit"]
categories = ["game-development"]
authors = ["LeagueToolkit"]

[dependencies]
ltk_game_data = { workspace = true }
camino = { workspace = true }
ignore = "0.4"
indexmap = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
ltk_hashtable = { workspace = true }
ltk_meta = { workspace = true }

# Optional: packing backends, one cargo feature per format
ltk_modpkg = { workspace = true, optional = true }
ltk_fantome = { workspace = true, optional = true }
ltk_wad = { workspace = true, optional = true }
ltk_file = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
image = { workspace = true, features = ["webp", "png", "jpeg", "gif", "bmp", "tiff", "ico"], optional = true }
webp-animation = { version = "0.9", optional = true }
semver = { workspace = true, optional = true }
slug = { workspace = true, optional = true }

[features]
default = []
modpkg = ["dep:ltk_modpkg", "dep:image", "dep:webp-animation", "dep:semver"]
fantome = [
    "dep:ltk_fantome",
    "dep:image",
    "dep:slug",
    "dep:ltk_wad",
    "dep:ltk_file",
    "dep:tempfile",
    "ltk_hashtable/wad"]

[dev-dependencies]
ltk_wad = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true }
