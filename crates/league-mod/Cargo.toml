[package]
name = "league-mod"
version = "0.2.1"
edition = "2021"
description = "[DEPRECATED] A comprehensive toolkit for creating, managing, and distributing League of Legends mods"
license = "Apache-2.0"
repository = "https://github.com/LeagueToolkit/league-mod"
homepage = "https://github.com/LeagueToolkit/league-mod"
documentation = "https://github.com/LeagueToolkit/league-mod/wiki"
readme = "../../README.md"
keywords = ["league-of-legends", "modding", "gaming", "cli", "toolkit"]
categories = ["command-line-utilities", "game-development"]
authors = ["LeagueToolkit"]

[dependencies]
clap = { version = "4.5.20", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
thiserror = { workspace = true }
toml = { workspace = true }
ltk_mod_project = { workspace = true, features = ["modpkg", "fantome"] }
ltk_mod_core = { workspace = true }
regex = "1.11.1"
serde_json = { workspace = true }
colored = "2"
inquire = "0.7.5"
slug = { workspace = true }
ltk_modpkg = { workspace = true }
ltk_fantome = { workspace = true }
glob = "0.3.2"
semver = { workspace = true }
binrw = { workspace = true }
zip = { workspace = true }
image = { workspace = true, features = ["webp", "png", "jpeg"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls"] }
serde = { workspace = true }
camino = { workspace = true, features = ["serde1", "proptest1"] }
sysinfo = { workspace = true }
directories-next = "2.0"
ltk_wad = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
