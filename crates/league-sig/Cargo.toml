[package]
name = "league-sig"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Ceremony and verification CLI for the ltk_sig platform-attested trust model"
repository = "https://github.com/LeagueToolkit/league-mod"
homepage = "https://github.com/LeagueToolkit/league-mod"
documentation = "https://github.com/LeagueToolkit/league-mod/wiki"
publish = false

[dependencies]
clap = { version = "4.5.20", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
camino = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
ltk_hash = "0.3.0"
ltk_sig = { version = "0.1.0", path = "../ltk_sig", features = ["base-skin"] }
ltk_overlay = { version = "0.5.0", path = "../ltk_overlay" }
ltk_wad = { workspace = true }
zstd = "0.13"